name: CI

# Läuft bei jedem Push auf main und bei jedem Pull Request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Ein neuerer Push auf dieselbe Ref macht den laufenden Check hinfällig.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Die untere und die obere Grenze des unterstützten Bereichs. dbdoku
        # hält 3.9 als Boden (alle Module nutzen `from __future__ import
        # annotations`); die Suite muss an beiden Enden grün sein.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Die einzige Entwicklungsabhängigkeit. Kein requirements.txt: dbdoku
      # selbst braucht nichts außerhalb der Standardbibliothek, und dafür eine
      # Abhängigkeitsdatei anzulegen würde das Gegenteil suggerieren.
      - name: Install coverage
        if: matrix.python == '3.13'
        run: python -m pip install --upgrade coverage

      # Abdeckung wird nur in einer Zelle gemessen: beide fahren dieselbe Suite,
      # ein zweiter Bericht wäre für Codecov nur ein Duplikat. Die Matrix ist
      # da, um Versionsunterschiede zu finden, nicht um zweimal zu messen.
      # Beide Zellen heben ihre Ausgabe für den Bericht unten auf.
      - name: Test
        if: matrix.python != '3.13'
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log

      # Einstellungen kommen aus .coveragerc, damit ein lokaler Lauf dieselbe
      # Zahl ergibt wie dieser hier.
      - name: Test with coverage
        if: matrix.python == '3.13'
        run: |
          set -o pipefail
          python -m coverage run -m unittest discover -s tests -v 2>&1 \
            | tee /tmp/unittest.log
          python -m coverage report
          python -m coverage report --format=markdown > /tmp/coverage.md
          python -m coverage xml

      # unittest schreibt sein Ergebnis in das Job-Log und sonst nirgendwohin,
      # deshalb werden die Zahlen hier auf die Run-Seite gehoben. Beide Zellen
      # berichten, betitelt mit der Python-Version: ein Versionsproblem taucht
      # nur in einer auf, und der Bericht der anderen würde den Lauf grün
      # nennen. Läuft auch, wenn die Tests fehlgeschlagen sind – dann ist er am
      # meisten wert.
      - name: Test report
        if: always()
        run: |
          # Kein errexit: GitHub führt das mit `bash -e` aus, und jede Suche
          # unten findet berechtigterweise manchmal nichts – keine Abdeckung in
          # der Zelle, die nicht misst, keine Fehlschläge in einem grünen Lauf.
          set +e
          [ -f /tmp/unittest.log ] || exit 0
          passed=$(grep -c ' \.\.\. ok$' /tmp/unittest.log)
          failed=$(grep -cE ' \.\.\. (FAIL|ERROR)$' /tmp/unittest.log)
          skipped=$(grep -c ' \.\.\. skipped' /tmp/unittest.log)
          {
            echo "## Unittest Report — Python ${{ matrix.python }}"
            echo
            echo "### Summary"
            if [ "$failed" -eq 0 ]; then
              echo "- Tests: ✅ $passed bestanden · $((passed + failed + skipped)) gesamt"
            else
              echo "- Tests: ❌ $failed fehlgeschlagen · $passed bestanden · $((passed + failed + skipped)) gesamt"
            fi
            [ "$skipped" -gt 0 ] && echo "- Übersprungen: ⚪ $skipped"
            # Die Tabelle schreibt `coverage report --format=markdown` fertig;
            # sie existiert nur in der messenden Zelle.
            if [ -f /tmp/coverage.md ]; then
              echo
              echo "### Coverage"
              echo
              cat /tmp/coverage.md
            fi
            # Nur die Fehlschläge einzeln: bei einem grünen Lauf sagt die
            # Zusammenfassung oben bereits alles.
            broken=$(sed -nE 's/^(.*) \.\.\. (FAIL|ERROR)$/- ❌ `\1`/p' /tmp/unittest.log)
            if [ -n "$broken" ]; then
              echo
              echo "### Fehlgeschlagen"
              printf '%s\n' "$broken"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Die Tests entscheiden, ob der Lauf rot ist; dieser Schritt
          # beschreibt nur, was sie getan haben.
          exit 0

      - name: Upload coverage
        if: matrix.python == '3.13'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Ein Codecov-Ausfall ist kein Grund, einen grünen Build rot zu
          # machen; das Abdeckungs-Gate ist der Status-Check, den Codecov
          # setzt, nicht dieser Schritt.
          fail_ci_if_error: false
